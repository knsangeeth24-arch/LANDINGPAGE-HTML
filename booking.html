<body><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="icon" href="png-clipart-logo-community-text-logo.png">
    <link rel="stylesheet" href="booking.css">
</head>
<body id="bok">
    <div class="Title">
    
    </div>
    <div class="form">
        <form  >
            <table border="0" id="booktable">
                <tr>
                    <th colspan="2"><h1 style="text-align: center; color: rgb(33, 74, 171); text-shadow: 3px 2px 5px black;">BOOK</h1><br></th>
                </tr>
            <tr>
                <th>Name:</th>
                <td><input type="text" placeholder="Enter your Name" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>Email:</th>
                <td><input type="email" placeholder="Enter your Email" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>Phone Number:</th>
                <td><input type="tel" value="+91" style="width: 20px">
                <label>-</label>
                <input type="tel" placeholder="Enter your Number" required style="width: 170px;">
                </td>
            </tr>
            <tr>
                <th>Country:</th>
                <td><input type="text" placeholder="Enter your Country" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>State:</th>
                <td><input type="text" placeholder="Enter your State" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>City:</th>
                <td><input type="text" placeholder="Enter your City" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>Address:</th>
                <td><textarea placeholder="Enter your Address" required style="width: 212px;"></textarea></td>
            </tr>
            <tr>
                <th>Tour Place:</th>
                <td>
                    <select name="Places" required style="width: 218px;">
                        <option>Bali</option>
                        <option>Maldivis</option>
                        <option>USA</option>
                        <option>Tokyo</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Visit Date:</th>
                <td><input type="date" required ></td>
            </tr>
            <tr>
                <th>Duration:</th>
                <td><input type="tel" placeholder="Enter no of Days" style="width: 210px;"></td>
            </tr>
            <tr>
                <th>Meal Prefer:</th>
                <td>
                    <input type="checkbox">
                    <label>Veg</label>
                    <input type="checkbox" >
                    <label>Non-Veg</label>
                </td>
            </tr>
            <tr>
                <th>No.of.Adults</th>
                <td><input type="tell" placeholder="No.of.Adults" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>No.of.children:</th>
                <td><input type="tel" placeholder="No.of.children" required style="width: 210px;"></td>
            </tr>
            <tr>
                <th>Special request:</th>
                <td><textarea placeholder="Any Disability Access" style="width: 213px;"></textarea></td>
            </tr>
            <tr>
                <th>Guide Required:</th>
                <td>
                    <input type="radio" name="yy">
                    <label>YES</label>
                    <input type="radio" name="yy">
                    <label>NO</label>
                </td>
            </tr>
            <tr>
                <th>Payment Menthod:</th>
                <td><input type="radio" name="Pay">
                <label>UPI</label>
                <input type="radio" name="Pay">
                <label>Card</label>
                <input type="radio" name="Pay">
                <label>Cash</label>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="padding: 10px;"><input type="checkbox" required>
                <label><a href="Terms and Condition.html">Terms & Conditions</a></label>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="padding-left: 120px;"><button type="submit" id="bttn">Book Now</button>
                </td>
            </tr>
        </table>
        </form>
    </div>
    
</body>
</html>
    
</body>
</html>
